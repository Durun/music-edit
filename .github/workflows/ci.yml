name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: music-edit-mcp
        run: uv sync --dev

      - name: Lint (ruff)
        working-directory: music-edit-mcp
        run: uv run ruff check src/

      - name: Type check (mypy)
        working-directory: music-edit-mcp
        run: uv run mypy src/

      - name: Test (pytest)
        working-directory: music-edit-mcp
        run: uv run pytest
