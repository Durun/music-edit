[project]
name = "music-edit-mcp"
version = "0.1.0"
description = "MCP server for LLM-driven music score editing (DAW composition support)"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0.0",
    "music21>=9.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
music-edit-mcp = "music_edit_mcp.server:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.0.0",
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pip-licenses>=5.5.5",
    "pytest-xdist>=3.8.0",
]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["music_edit_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
